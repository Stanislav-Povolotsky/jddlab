name: Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:          # This enables manual triggering

concurrency:
  group: pages-build          # Name for the group of workflows to control concurrency
  cancel-in-progress: true    # Cancel any currently running workflow if a new one starts

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install markdown-it-py mdit-py-plugins linkify-it-py

    - name: Fetch GitHub Markdown CSS
      run: curl -fsSL -o github-markdown.css https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.css

    - name: Fetch highlight.js
      run: |
        mkdir -p hljs
        base=https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11
        curl -fsSL -o hljs/highlight.min.js    "$base/highlight.min.js"
        curl -fsSL -o hljs/github.min.css      "$base/styles/github.min.css"
        curl -fsSL -o hljs/github-dark.min.css "$base/styles/github-dark.min.css"

    - name: Build site
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python .github/build-pages.py

    - name: Deploy to Github Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public

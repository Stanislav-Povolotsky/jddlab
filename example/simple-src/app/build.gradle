plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.simple'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.simple"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Native (JNI) build. Requires the Android NDK (Android Studio installs it
        // on demand; from CLI set the NDK via SDK Manager or ndkVersion below).
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        // Sign the release build with the standard Android debug keystore so that
        // `assembleRelease` produces an installable, R8-obfuscated APK with no extra
        // setup. Android Studio creates ~/.android/debug.keystore automatically; if it
        // does not exist, see example/README.md for how to generate it.
        release {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // enable R8 (code shrinking + obfuscation)
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
